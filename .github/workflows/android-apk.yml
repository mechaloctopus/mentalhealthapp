name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Patch expo-modules-core for AGP compatibility
        run: |
          # expo-modules-core@2.2.3 uses `from components.release` inside afterEvaluate,
          # which fails on newer AGP versions where variants are registered lazily.
          # We don't need Maven Local publishing for an APK build, so comment it out.
          sed -i 's/from components\.release/\/\/ from components.release (patched for AGP compat)/' \
            node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodSignal-v2-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
